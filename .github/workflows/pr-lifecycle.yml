name: PR Triage and Lifecycle Automation

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
  schedule:
    - cron: '*/5 * * * *' # Runs every ~5 minutes (accommodating GitHub Actions cron scheduling behavior)
  workflow_dispatch:

jobs:
  manage-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Run PR Lifecycle and Triage Logic
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = require('./.github/scripts/pr-lifecycle.js');
            await script({ github, context, core });
